<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codemap</title>
<style>
  /* Palette: validated categorical slots 1-3 plus neutral surfaces.
     Glyph identity is carried by colour AND shape, so the light-mode contrast
     warning on slots 2 and 3 is covered by shape, labels and the legend. */
  :root {
    color-scheme: light;
    --canvas:        #f7f6f3;
    --district:      #ecebe4;
    --district-line: #c6c3b4;
    --block:         #dedbd0;
    --block-line:    #aeab9b;
    --panel:         #fcfcfb;
    --ink:           #0b0b0b;
    --ink-2:         #52514e;
    --ink-muted:     #898781;
    --hairline:      rgba(11, 11, 11, 0.10);
    --edge:          rgba(11, 11, 11, 0.07);
    --kind-class:    #2a78d6;
    --kind-interface:#eb6834;
    --kind-value:    #1baf7a;
    --kind-file:     #898781;
    --dir-out:       #2a78d6;
    --dir-in:        #eb6834;
    /* Proposal statuses. Reserved: never reused as a categorical slot. Green/amber/red
       cannot be separated by hue alone under red-green colour blindness, so status is
       also carried by ring texture (double / solid / dashed) and spelled out in the
       proposal panel - and the amber's sub-3:1 contrast is relieved by those labels. */
    --prop-add:      #0e7546;
    --prop-change:   #dfa300;
    --prop-del:      #c4291c;
    --shadow:        0 1px 3px rgba(11, 11, 11, .09), 0 8px 24px rgba(11, 11, 11, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --canvas:        #0d0d0d;
      --district:      #1c1c1a;
      --district-line: #3d3d37;
      --block:         #2b2b28;
      --block-line:    #52524a;
      --panel:         #1a1a19;
      --ink:           #ffffff;
      --ink-2:         #c3c2b7;
      --ink-muted:     #898781;
      --hairline:      rgba(255, 255, 255, 0.10);
      --edge:          rgba(255, 255, 255, 0.09);
      --kind-class:    #3987e5;
      --kind-interface:#d95926;
      --kind-value:    #199e70;
      --kind-file:     #898781;
      --dir-out:       #3987e5;
      --dir-in:        #d95926;
      /* selected against the dark surface, not flipped from the light steps */
      --prop-add:      #33aa74;
      --prop-change:   #b8860b;
      --prop-del:      #c73b2e;
      --shadow:        0 1px 3px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas:        #0d0d0d;
    --district:      #1c1c1a;
    --district-line: #3d3d37;
    --block:         #2b2b28;
    --block-line:    #52524a;
    --panel:         #1a1a19;
    --ink:           #ffffff;
    --ink-2:         #c3c2b7;
    --ink-muted:     #898781;
    --hairline:      rgba(255, 255, 255, 0.10);
    --edge:          rgba(255, 255, 255, 0.09);
    --kind-class:    #3987e5;
    --kind-interface:#d95926;
    --kind-value:    #199e70;
    --kind-file:     #898781;
    --dir-out:       #3987e5;
    --dir-in:        #d95926;
    --prop-add:      #33aa74;
    --prop-change:   #b8860b;
    --prop-del:      #c73b2e;
    --shadow:        0 1px 3px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--canvas); color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* width/height are required: <canvas> is a replaced element, so `inset: 0` alone
     leaves it at its intrinsic 300x150 instead of filling the viewport. */
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
         touch-action: none; cursor: grab; }
  #map.dragging { cursor: grabbing; }

  /* labels drawn over the canvas */
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; white-space: nowrap; transform: translate(-50%, -50%);
    text-shadow: 0 0 3px var(--canvas), 0 0 3px var(--canvas), 0 0 6px var(--canvas);
    will-change: transform;
  }
  /* no text-transform: the label text is uppercased in JS so that what the placer
     measures is what the browser draws */
  .lbl.district { font-weight: 650; letter-spacing: .04em; color: var(--ink-2); }
  .lbl.block    { font-weight: 550; color: var(--ink-2); }
  .lbl.type     { color: var(--ink); }
  .lbl.port     { font-weight: 600; color: var(--ink); pointer-events: auto; cursor: pointer; }
  .lbl.port:hover { text-decoration: underline; }
  /* a proposed node does not exist yet, so its label says so */
  .lbl.prop     { font-weight: 600; font-style: italic; color: var(--prop-add); }
  /* the folded tail: a count you can open */
  .lbl.fold     { font-weight: 600; color: var(--ink-muted); pointer-events: auto;
                  cursor: pointer; }
  .lbl.fold:hover { text-decoration: underline; }

  /* chrome */
  .panel {
    position: fixed; background: var(--panel);
    border: 1px solid var(--hairline); border-radius: 10px; box-shadow: var(--shadow);
  }
  #top { top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; align-items: center;
         padding: 8px 10px; z-index: 3; }
  #brand { font-weight: 700; letter-spacing: .02em; }
  #brand span { color: var(--ink-muted); font-weight: 500; margin-left: 6px; }
  #crumbs { display: flex; gap: 4px; align-items: center; flex: 1; min-width: 0;
            overflow: hidden; color: var(--ink-2); }
  #crumbs button {
    font: inherit; color: var(--ink-2); background: none; border: 0; padding: 2px 5px;
    border-radius: 5px; cursor: pointer; max-width: 220px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  #crumbs button:hover { background: var(--block); color: var(--ink); }
  #crumbs .sep { color: var(--ink-muted); }
  /* the name prefix every entity in the view shares, shown once instead of on every label */
  #prefix { color: var(--ink-muted); font-size: 11px; white-space: nowrap; flex: none; }
  .searchwrap { position: relative; }
  #search {
    font: inherit; color: var(--ink); background: var(--canvas); width: 210px;
    border: 1px solid var(--hairline); border-radius: 7px; padding: 5px 9px;
  }
  #search:focus { outline: 2px solid var(--kind-class); outline-offset: -1px; }
  #results {
    position: absolute; top: 32px; right: 0; width: 340px; max-height: 60vh; overflow: auto;
    background: var(--panel); border: 1px solid var(--hairline); border-radius: 9px;
    box-shadow: var(--shadow); display: none; z-index: 5;
  }
  #results.open { display: block; }
  #results div {
    padding: 6px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline;
    border-bottom: 1px solid var(--hairline);
  }
  #results div:last-child { border-bottom: 0; }
  #results div:hover { background: var(--block); }
  #results .q { color: var(--ink-muted); font-size: 11px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    font: inherit; color: var(--ink-2); background: var(--canvas); cursor: pointer;
    border: 1px solid var(--hairline); border-radius: 7px; padding: 5px 9px;
  }
  .btn:hover { color: var(--ink); }

  /* details sidebar */
  #side {
    top: 62px; right: 12px; width: 330px; max-height: calc(100vh - 150px);
    overflow: auto; padding: 12px 14px; z-index: 3; display: none;
  }
  #side.open { display: block; }
  #side h2 { margin: 0 0 2px; font-size: 15px; line-height: 1.25; word-break: break-word; }
  #side .qname { color: var(--ink-muted); font-size: 11px; word-break: break-all; margin-bottom: 10px; }
  #side .facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin-bottom: 12px; }
  #side .facts dt { color: var(--ink-muted); }
  #side .facts dd { margin: 0; color: var(--ink-2); word-break: break-all; }
  #side h3 {
    margin: 12px 0 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-muted); display: flex; align-items: center; gap: 6px;
  }
  #side h3 .swatch { width: 8px; height: 8px; border-radius: 2px; }
  #side ul { list-style: none; margin: 0; padding: 0; }
  #side li {
    display: flex; gap: 8px; align-items: baseline; padding: 3px 4px; border-radius: 5px;
    cursor: pointer;
  }
  #side li:hover { background: var(--block); }
  #side li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #side li .w { color: var(--ink-muted); font-variant-numeric: tabular-nums; font-size: 11px; }
  #side .empty { color: var(--ink-muted); }
  #closeside { position: absolute; top: 8px; right: 10px; }

  /* proposal overlay panel: what an LLM has drawn onto the map */
  #prop {
    top: 62px; left: 12px; width: 316px; max-height: calc(100vh - 230px);
    overflow: auto; padding: 11px 13px; z-index: 4; display: none;
  }
  #prop.open { display: block; }
  #prop .head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  #prop h2 { margin: 0; font-size: 13px; line-height: 1.3; flex: 1; word-break: break-word; }
  #prop .sub { color: var(--ink-muted); font-size: 11px; margin: -4px 0 8px; }
  /* the status key: colour AND ring texture AND the word, so none of the three has to
     carry identity on its own */
  #prop .key { display: flex; flex-wrap: wrap; gap: 3px 11px; margin-bottom: 9px;
               padding-bottom: 8px; border-bottom: 1px solid var(--hairline); }
  #prop .key span { display: flex; gap: 5px; align-items: center; color: var(--ink-2);
                    font-size: 11px; }
  #prop ul { list-style: none; margin: 0; padding: 0; }
  #prop li { padding: 4px 5px; border-radius: 5px; cursor: pointer;
             display: grid; grid-template-columns: 11px 1fr; gap: 7px; align-items: baseline; }
  #prop li:hover { background: var(--block); }
  #prop li .op { font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
                 font-weight: 700; }
  #prop li .what { overflow: hidden; }
  #prop li .what b { font-weight: 600; }
  #prop li .note { color: var(--ink-muted); font-size: 11px; }
  #prop .op-add    { color: var(--prop-add); }
  #prop .op-modify { color: var(--prop-change); }
  #prop .op-delete { color: var(--prop-del); }
  #prop .op-mark   { color: var(--ink-muted); }

  /* settings */
  #settings {
    top: 62px; right: 12px; width: 330px; padding: 12px 14px; z-index: 5; display: none;
  }
  #settings.open { display: block; }
  #settings h2 { margin: 0 0 2px; font-size: 15px; }
  #settings .hint { color: var(--ink-muted); font-size: 11px; margin-bottom: 12px; }
  #settings-close { position: absolute; top: 8px; right: 10px; }
  #settings .setting {
    display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: start;
    padding: 7px 6px; border-radius: 6px; cursor: pointer;
  }
  #settings .setting:hover { background: var(--block); }
  #settings .setting input { margin-top: 2px; accent-color: var(--kind-class); }
  #settings .setting b { display: block; font-weight: 600; }
  #settings .setting em {
    display: block; color: var(--ink-muted); font-style: normal; font-size: 11px;
    margin-top: 2px;
  }

  /* legend + status */
  #legend { bottom: 12px; left: 12px; padding: 9px 12px; z-index: 3; max-width: 300px; }
  #legend h4 { margin: 0 0 6px; font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
               color: var(--ink-muted); }
  #legend .row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 7px; }
  #legend .item { display: flex; gap: 6px; align-items: center; color: var(--ink-2); }
  #legend svg { flex: none; }
  #legend .hint { color: var(--ink-muted); font-size: 11px; border-top: 1px solid var(--hairline);
                  padding-top: 6px; margin-top: 2px; }
  #stats { bottom: 12px; right: 12px; padding: 7px 11px; z-index: 3; color: var(--ink-2);
           font-variant-numeric: tabular-nums; }
  #stats b { color: var(--ink); font-weight: 600; }

  #tip {
    position: fixed; z-index: 6; pointer-events: none; display: none; max-width: 320px;
    background: var(--panel); color: var(--ink); border: 1px solid var(--hairline);
    border-radius: 7px; box-shadow: var(--shadow); padding: 6px 9px;
  }
  #tip .k { color: var(--ink-muted); font-size: 11px; }
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 7;
    padding: 10px 16px; color: var(--ink-2);
  }
  #zoom { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; z-index: 3; }
  #zoom button {
    font: inherit; color: var(--ink-2); background: none; border: 0; cursor: pointer;
    padding: 6px 12px; border-right: 1px solid var(--hairline);
  }
  #zoom button:last-child { border-right: 0; }
  #zoom button:hover { background: var(--block); color: var(--ink); }
</style>
</head>
<body data-palette="#2a78d6,#eb6834,#1baf7a">
<canvas id="map"></canvas>
<div id="labels"></div>

<div id="top" class="panel">
  <div id="brand">codemap</div>
  <nav id="crumbs" aria-label="breadcrumb"></nav>
  <span id="prefix" title=""></span>
  <button class="btn" id="theme" title="Toggle light / dark">◐</button>
  <button class="btn" id="reset">Fit</button>
  <div class="searchwrap">
    <input id="search" type="search" placeholder="Search modules, packages, types" autocomplete="off">
    <div id="results"></div>
  </div>
  <button class="btn" id="settings-btn" title="Settings" aria-haspopup="dialog">⚙</button>
</div>

<aside id="settings" class="panel" role="dialog" aria-label="Settings">
  <button class="btn" id="settings-close" title="Close">✕</button>
  <h2>Settings</h2>
  <div class="hint">Saved with the graph, and kept when you rescan it.</div>
  <label class="setting">
    <input type="checkbox" id="set-planning-focus">
    <span>
      <b>Focus on the change while planning</b>
      <em>While a proposal is on the map, draw only what it touches and the edges
        between those entities — proposed or already there. Everything else is left
        out rather than faded.</em>
    </span>
  </label>
</aside>

<aside id="side" class="panel" aria-live="polite">
  <button class="btn" id="closeside">✕</button>
  <h2 id="s-name"></h2>
  <div class="qname" id="s-qname"></div>
  <dl class="facts" id="s-facts"></dl>
  <div id="s-links"></div>
</aside>

<aside id="prop" class="panel" aria-live="polite">
  <div class="head">
    <h2 id="p-title"></h2>
    <button class="btn" id="p-toggle" title="Show the map without the overlay">On</button>
  </div>
  <div class="sub" id="p-sub"></div>
  <div class="key" id="p-key"></div>
  <ul id="p-list"></ul>
</aside>

<div id="legend" class="panel">
  <h4>Node</h4>
  <div class="row" id="legend-kinds"></div>
  <h4>Edge</h4>
  <div class="row" id="legend-edges"></div>
  <div class="hint" id="legend-hint">Drag to pan · scroll to zoom · click to inspect · double-click to enter</div>
</div>

<div id="zoom" class="panel">
  <button id="zoom-out" title="Zoom out">−</button>
  <button id="zoom-in" title="Zoom in">+</button>
</div>

<div id="stats" class="panel"></div>
<div id="tip"></div>
<div id="loading" class="panel">Loading map…</div>

<script src="app.js"></script>
</body>
</html>
